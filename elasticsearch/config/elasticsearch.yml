# ================================================================
# Elasticsearch - Exchange ELK Stack (600 Mailbox, 90-gun retention)
# Veriler sistem diskine yazılmaz; path.data /data'da (2. disk)
# ================================================================

cluster.name: "exchange-elk-cluster"
node.name: "elasticsearch-node1"
network.host: 0.0.0.0

# Single-node cluster (initial_master_nodes + single-node birlikte kullanılamaz)
discovery.type: single-node

# ---- Veri yolları (2. disk) ------------------------------------
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs
path.repo: ["/data/elasticsearch/backups"]

# ---- Bellek -----------------------------------------------
bootstrap.memory_lock: true
indices.memory.index_buffer_size: 20%

# ---- Circuit breaker (tek node için daha geniş limitler) ---
indices.breaker.total.limit: 85%
indices.breaker.request.limit: 50%
indices.breaker.fielddata.limit: 30%

# ---- Varsayılan index ayarları -----------------------------
# index.codec: best_compression  → ILM warm fazında forcemerge ile uygulanır
# Hot indeksler default (LZ4) - yazma hızı öncelikli

# ---- Thread pool (8 CPU core için) -------------------------
thread_pool.write.queue_size: 1000
thread_pool.search.queue_size: 500

# ---- ILM / Monitoring --------------------------------------
xpack.security.enabled: true
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false
# xpack.monitoring.collection.enabled kaldırıldı (ES 9'da yok; Elastic Agent kullanın)

# ---- SAML / Entra ID SSO -----------------------------------
xpack.security.authc.realms.native.native1:
  order: 0

xpack.security.authc.realms.saml.saml1:
  order: 1
  idp.metadata.path: saml/entra-metadata.xml
  idp.entity_id: "https://sts.windows.net/c4c34dec-4224-42e4-9deb-24bee4551281/"
  sp.entity_id: "kibana-exchange-elk"
  sp.acs: "https://mailtrace.btcturk.local/api/security/saml/callback"
  sp.logout: "https://mailtrace.btcturk.local/logout"
  attributes.principal: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"
  attributes.name: "http://schemas.microsoft.com/identity/claims/displayname"
  attributes.mail: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
  attributes.groups: "http://schemas.microsoft.com/ws/2008/06/identity/claims/groups"

# ---- Logging -----------------------------------------------
logger.org.elasticsearch.discovery: WARN
logger.org.elasticsearch.deprecation: ERROR