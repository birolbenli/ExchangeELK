# ================================================================
# Filebeat — Exchange Server (Windows)
#
# Asıl log yolu: bu host üzerindeki Exchange Logging dizinleri.
# Ubuntu /data/exchange-logs ve docker Filebeat KULLANILMIYOR.
#
#   Log Türü              Tag               log_type
#   ─────────────────     ──────────────    ─────────────────
#   Message Tracking      MessageTracking   message-tracking
#   IIS W3C               ExchangeIIS       iis
#   HTTP Protocol         HttpProxy         httpproxy
#   MAPI HTTP             MapiHttp          mapihttp
#   SMTP Receive          SmtpReceive       smtp-receive
#   SMTP Send             SmtpSend          smtp-send
#
# Kurulum: scripts/setup-exchange-forwarding.ps1
#   -ELKServerIP "10.11.12.19" -InstallFilebeatAgent
# Registry sıfırlama (5044 uzun süre refuse olduysa, son 48s):
#   -ResetRegistry
# ================================================================

# 5044 refuse / reboot sonrası event kaybını azalt (disk kuyruğu)
queue.disk:
  max_size: 2GB
  path: C:\ProgramData\filebeat\queue

filebeat.inputs:

# ------------------------------------------------------------------
# 1. Message Tracking
# ------------------------------------------------------------------
- type: filestream
  enabled: true
  id: exchange-message-tracking
  take_over: true
  paths:
    - 'C:\Program Files\Microsoft\Exchange Server\V15\Logging\MessageTracking\*.LOG'
    - 'C:\Program Files\Microsoft\Exchange Server\V15\Logging\MessageTracking\*.log'
    - 'Z:\MessageTrackingLogs\*.LOG'
    - 'Z:\MessageTrackingLogs\*.log'
  encoding: utf-8
  exclude_lines: ['^#']
  tags: ["MessageTracking"]
  fields:
    log_type: message-tracking
  fields_under_root: true
  ignore_older: 48h
  clean_inactive: 72h
  clean_removed: false
  prospector.scanner.check_interval: 10s
  close.on_state_change.inactive: 5m
  close.on_state_change.renamed: true
  file_identity.path: ~
  buffer_size: 32768

# ------------------------------------------------------------------
# 2. IIS W3C
# ------------------------------------------------------------------
- type: filestream
  enabled: true
  id: exchange-iis
  take_over: true
  paths:
    - 'C:\inetpub\logs\LogFiles\W3SVC*\*.log'
  encoding: utf-8
  exclude_lines: ['^#']
  tags: ["ExchangeIIS"]
  fields:
    log_type: iis
  fields_under_root: true
  ignore_older: 48h
  clean_inactive: 72h
  clean_removed: false
  prospector.scanner.check_interval: 15s
  close.on_state_change.inactive: 5m
  file_identity.path: ~
  buffer_size: 32768

# ------------------------------------------------------------------
# 3a. HttpProxy
# ------------------------------------------------------------------
- type: filestream
  enabled: true
  id: exchange-httpproxy
  take_over: true
  paths:
    - 'C:\Program Files\Microsoft\Exchange Server\V15\Logging\HttpProxy\*\*.log'
  encoding: utf-8
  exclude_lines: ['^#']
  tags: ["HttpProxy"]
  fields:
    log_type: httpproxy
  fields_under_root: true
  ignore_older: 48h
  clean_inactive: 72h
  clean_removed: false
  prospector.scanner.check_interval: 30s
  close.on_state_change.inactive: 10m
  file_identity.path: ~
  buffer_size: 65536

# ------------------------------------------------------------------
# 3b. MAPI HTTP
# ------------------------------------------------------------------
- type: filestream
  enabled: true
  id: exchange-mapihttp
  take_over: true
  paths:
    - 'C:\Program Files\Microsoft\Exchange Server\V15\Logging\MapiHttp\*\*.log'
    - 'C:\Program Files\Microsoft\Exchange Server\V15\Logging\MapiHttp\Emsmdb\*.log'
  encoding: utf-8
  exclude_lines: ['^#']
  tags: ["MapiHttp"]
  fields:
    log_type: mapihttp
  fields_under_root: true
  ignore_older: 48h
  clean_inactive: 72h
  clean_removed: false
  prospector.scanner.check_interval: 30s
  close.on_state_change.inactive: 10m
  file_identity.path: ~
  buffer_size: 65536

# ------------------------------------------------------------------
# 4a. SMTP Receive
# ------------------------------------------------------------------
- type: filestream
  enabled: true
  id: exchange-smtp-receive
  take_over: true
  paths:
    - 'C:\Program Files\Microsoft\Exchange Server\V15\Logging\ProtocolLog\SmtpReceive\*.log'
    - 'Z:\SmtpReceive\*.log'
  encoding: utf-8
  exclude_lines: ['^#']
  tags: ["SmtpReceive"]
  fields:
    log_type: smtp-receive
  fields_under_root: true
  ignore_older: 48h
  clean_inactive: 72h
  clean_removed: false
  prospector.scanner.check_interval: 15s
  close.on_state_change.inactive: 5m
  file_identity.path: ~
  buffer_size: 32768

# ------------------------------------------------------------------
# 4b. SMTP Send
# ------------------------------------------------------------------
- type: filestream
  enabled: true
  id: exchange-smtp-send
  take_over: true
  paths:
    - 'C:\Program Files\Microsoft\Exchange Server\V15\Logging\ProtocolLog\SmtpSend\*.log'
    - 'Z:\SmtpSend\*.log'
  encoding: utf-8
  exclude_lines: ['^#']
  tags: ["SmtpSend"]
  fields:
    log_type: smtp-send
  fields_under_root: true
  ignore_older: 48h
  clean_inactive: 72h
  clean_removed: false
  prospector.scanner.check_interval: 15s
  close.on_state_change.inactive: 5m
  file_identity.path: ~
  buffer_size: 32768

# ================================================================
# Registry — reboot / domain join sonrası kaldığı yerden devam
# path.data altında tutulur (Windows servis varsayılanı ProgramData)
# ================================================================
path.data: C:\ProgramData\filebeat
filebeat.registry.path: C:\ProgramData\filebeat\registry
filebeat.registry.flush: 5s
filebeat.shutdown_timeout: 30s

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - drop_fields:
      fields:
        - "agent.ephemeral_id"
        - "ecs"
        - "input.type"
        - "log.offset"
        - "log.file.device_id"
        - "log.file.inode"
      ignore_missing: true

# 5044 kısa süre refuse olsa bile sonsuz retry + pipelining kapalı
# (pipelining, Logstash restart sonrası ACK kaybına yol açabiliyor)
output.logstash:
  hosts: ["10.11.12.19:5044"]
  compression_level: 3
  bulk_max_size: 1024
  pipelining: 0
  ttl: 60s
  timeout: 30s
  max_retries: -1
  backoff.init: 1s
  backoff.max: 60s
  slow_start: true
  loadbalance: false
  ssl.enabled: false

logging.level: info
logging.to_files: true
logging.files:
  path: C:\ProgramData\filebeat\logs
  name: filebeat
  keepfiles: 7
  permissions: "0644"

logging.metrics.enabled: true
logging.metrics.period: 60s
