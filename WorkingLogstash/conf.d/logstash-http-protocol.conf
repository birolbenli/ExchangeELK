input {
  beats {
    port => 5045
    id => "ExHttpProtocol_id"
  }
}
filter {
  if "HttpProxy" in [tags] {
    csv {
      columns => ['DateTime','RequestId','MajorVersion','MinorVersion','BuildVersion','RevisionVersion','ClientRequestId','Protocol','UrlHost','UrlStem','ProtocolAction','AuthenticationType','IsAuthenticated','AuthenticatedUser','Organization','AnchorMailbox','UserAgent','ClientIpAddress','ServerHostName','HttpStatus','BackEndStatus','ErrorCode','Method','ProxyAction','TargetServer','TargetServerVersion','RoutingType','RoutingHint','BackEndCookie','ServerLocatorHost','ServerLocatorLatency','RequestBytes','ResponseBytes','TargetOutstandingRequests','AuthModulePerfContext','HttpPipelineLatency','CalculateTargetBackEndLatency','GlsLatencyBreakup','TotalGlsLatency','AccountForestLatencyBreakup','TotalAccountForestLatency','ResourceForestLatencyBreakup','TotalResourceForestLatency','ADLatency','SharedCacheLatencyBreakup','TotalSharedCacheLatency','ActivityContextLifeTime','ModuleToHandlerSwitchingLatency','ClientReqStreamLatency','BackendReqInitLatency','BackendReqStreamLatency','BackendProcessingLatency','BackendRespInitLatency','BackendRespStreamLatency','ClientRespStreamLatency','KerberosAuthHeaderLatency','HandlerCompletionLatency','RequestHandlerLatency','HandlerToModuleSwitchingLatency','ProxyTime','CoreLatency','RoutingLatency','HttpProxyOverhead','TotalRequestTime','RouteRefresherLatency','UrlQuery','BackEndGenericInfo','GenericInfo','GenericErrors','EdgeTraceId','DatabaseGuid','UserADObjectGuid','PartitionEndpointLookupLatency','RoutingStatus']
      remove_field => [ "DateTime" ]
    }
    grok {
        match => [ "message", "%{TIMESTAMP_ISO8601:timestamp}" ]
    }
    mutate {
        convert => [ "RequestBytes", "integer" ]
        convert => [ "ResponseBytes", "integer" ]
        split => ["GenericInfo", ";"]
        split => [ "GenericErrors", ";" ]
    }
    date {
        match => [ "timestamp", "ISO8601" ]
        timezone => "Europe/Istanbul"
        remove_field => [ "timestamp" ]
    }
    if "_grokparsefailure" in [tags] {
          drop { }
    }
  } else if "MapiHttp" in [tags] {
    csv {
      columns => ['DateTime','RequestId','MapiRequestId','ClientRequestId','RequestType','HttpStatusCode','ResponseCode','StatusCode','ReturnCode','TotalRequestLatency','DeploymentRing','MajorVersion','MinorVersion','BuildVersion','RevisionVersion','AuthenticatedUserEmail','UPN','Puid','TenantGuid','MailboxId','MDBGuid','ActAsUserEmail','ClientIP','SourceCafeServer','EdgeInfo','NetworkDeviceInfo','SessionCookie','SequenceCookie','MapiClientInfo','ClientSoftware','ClientSoftwareVersion','ClientMode','AuthenticationType','AuthModuleLatency','LiveIdBasicLog','LiveIdBasicError','LiveIdNegotiateError','OAuthLatency','OAuthError','OAuthErrorCategory','OAuthExtraInfo','AuthenticatedUser','RopIds','OperationSpecific','GenericInfo','GenericErrors']
      remove_field => [ "DateTime" ]
      remove_field => [ "EdgeInfo" ]
      remove_field => [ "SessionCookie" ]
      remove_field => [ "SequenceCookie" ]
      remove_field => [ "MapiClientInfo" ]
      remove_field => [ "NetworkDeviceInfo" ]
      remove_field => [ "UPN" ]
      remove_field => [ "TenantGuid" ]
      remove_field => [ "Puid" ]
      remove_field => [ "DeploymentRing" ]
      remove_field => [ "AuthModuleLatency" ]
      remove_field => [ "LiveIdBasicLog" ]
      remove_field => [ "LiveIdBasicError" ]
      remove_field => [ "LiveIdNegotiateError" ]
      remove_field => [ "OAuthLatency" ]
      remove_field => [ "DeploymentRing" ]
      remove_field => [ "OAuthError" ]
      remove_field => [ "OAuthErrorCategory" ]
      remove_field => [ "OAuthExtraInfo" ]
      remove_field => [ "RopIds" ]
      remove_field => [ "GenericInfo" ]
    }
    grok {      
        match => [ "message", "%{TIMESTAMP_ISO8601:timestamp}" ]
    }
    mutate {
        convert => [ "TotalRequestLatency", "integer" ]
    }
    date {
        match => [ "timestamp", "ISO8601" ]
        timezone => "Europe/Istanbul"
        remove_field => [ "timestamp" ]
    }
    if "_grokparsefailure" in [tags] {
          drop { }
    }
  }
}
output {
  if "HttpProxy" in [tags] {
     elasticsearch {
       hosts => "localhost:9200"
       index => "exhttpproxy-%{+YYYY-MM-dd}"
     }
  }
  else if "MapiHttp" in [tags] {
     elasticsearch {
       hosts => "localhost:9200"
       index => "exmapihttp-%{+YYYY-MM-dd}"
     }
  }
}