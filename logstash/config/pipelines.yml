# ================================================================
# Logstash Multiple Pipelines Konfigürasyonu
#
# Mimari (Pipeline-to-Pipeline):
#
#  Windows Filebeat (port 5044)
#       ↓
#  [exchange-router]  ← tüm loglar tek noktaya girer
#       ↓ tag / log_type / path
#  [msgtrk] [iis] [http-protocol] [smtp] [unmatched]
#
# Ubuntu docker Filebeat + /data/exchange-logs KULLANILMIYOR.
# ecs_compatibility: disabled — Filebeat tags/path alanları kaymasın.
#
# Domain join / reboot sonrası 5044 refuse: Logstash PQ kurtarana kadar
# beats input kapalı kalabilir. PQ bozulursa:
#   docker compose stop logstash
#   rm -rf /data/logstash/data/queue/exchange-*
#   docker compose start logstash
# ================================================================

# --- Giriş (Router) -------------------------------------------
- pipeline.id: exchange-router
  path.config: "/usr/share/logstash/pipeline/pipeline-router.conf"
  pipeline.workers: 2
  pipeline.batch.size: 1000
  pipeline.ecs_compatibility: "disabled"
  queue.type: persisted
  queue.max_bytes: 2gb
  dead_letter_queue.enable: true

# --- Downstream: Message Tracking ------------------------------
- pipeline.id: exchange-message-tracking
  path.config: "/usr/share/logstash/pipeline/pipeline-message-tracking.conf"
  pipeline.workers: 2
  pipeline.batch.size: 500
  pipeline.ecs_compatibility: "disabled"
  queue.type: persisted
  queue.max_bytes: 2gb
  dead_letter_queue.enable: true

# --- Downstream: IIS W3C Logs ----------------------------------
- pipeline.id: exchange-iis
  path.config: "/usr/share/logstash/pipeline/pipeline-iis.conf"
  pipeline.workers: 2
  pipeline.batch.size: 500
  pipeline.ecs_compatibility: "disabled"
  queue.type: persisted
  dead_letter_queue.enable: true

# --- Downstream: HTTP Protocol / MAPI --------------------------
- pipeline.id: exchange-http-protocol
  path.config: "/usr/share/logstash/pipeline/pipeline-http-protocol.conf"
  pipeline.workers: 2
  pipeline.batch.size: 500
  pipeline.ecs_compatibility: "disabled"
  queue.type: persisted
  dead_letter_queue.enable: true

# --- Downstream: SMTP Send / Receive ---------------------------
- pipeline.id: exchange-smtp
  path.config: "/usr/share/logstash/pipeline/pipeline-smtp.conf"
  pipeline.workers: 1
  pipeline.batch.size: 200
  pipeline.ecs_compatibility: "disabled"
  queue.type: persisted
  dead_letter_queue.enable: true

# --- Router'da eşleşmeyen event'ler (sessiz drop yerine) -------
- pipeline.id: exchange-unmatched
  path.config: "/usr/share/logstash/pipeline/pipeline-unmatched.conf"
  pipeline.workers: 1
  pipeline.batch.size: 200
  pipeline.ecs_compatibility: "disabled"
  queue.type: persisted
  dead_letter_queue.enable: true

# --- FortiMail Syslog (UDP/TCP 5514) ---------------------------
# Exchange router'dan BAĞIMSIZ; FortiMail syslog doğrudan gelir.
- pipeline.id: fortimail
  path.config: "/usr/share/logstash/pipeline/pipeline-fortimail.conf"
  pipeline.workers: 2
  pipeline.batch.size: 500
  pipeline.ecs_compatibility: "disabled"
  queue.type: persisted
  dead_letter_queue.enable: true
