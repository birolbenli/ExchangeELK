# ================================================================
# Pipeline Router - Giriş Noktası (port 5044)
# Tüm Filebeat logları buraya gelir, tag'e göre yönlendirilir.
#
# Mimari (Logstash Pipeline-to-Pipeline):
#
#  Filebeat → [router:5044] → internal queue → [pipeline-message-tracking]
#                           → internal queue → [pipeline-iis]
#                           → internal queue → [pipeline-http-protocol]
#                           → internal queue → [pipeline-smtp]
# ================================================================

input {
  beats {
    port => 5044
    id   => "exchange_router_input"
  }
}

filter {
  # Header satırlarını burada da düşür (parse etmeden önce)
  if [message] =~ /^#/ {
    drop {}
  }
}

output {
  if "MessageTracking" in [tags] {
    pipeline { send_to => "exchange-message-tracking" }
  }
  else if "ExchangeIIS" in [tags] {
    pipeline { send_to => "exchange-iis" }
  }
  else if "HttpProxy" in [tags] or "MapiHttp" in [tags] {
    pipeline { send_to => "exchange-http-protocol" }
  }
  else if "SmtpReceive" in [tags] or "SmtpSend" in [tags] {
    pipeline { send_to => "exchange-smtp" }
  }
  else {
    # Tanınmayan tag — dead_letter_queue'ya düşer (silinmez, incelenebilir)
  }
}