# ================================================================
# Pipeline Router - Giriş Noktası (port 5044)
# Tüm Windows Filebeat logları buraya gelir, tag / log_type / path
# ile yönlendirilir.
#
# Mimari (Logstash Pipeline-to-Pipeline):
#
#  Filebeat → [router:5044] → [pipeline-message-tracking]
#                           → [pipeline-iis]
#                           → [pipeline-http-protocol]
#                           → [pipeline-smtp]
#                           → [pipeline-unmatched]   (sessiz drop YOK)
#
# Tag alias'ları (README/ARCHITECTURE vs Windows Filebeat):
#   MessageTracking | ExchangeMsgTrack
# ================================================================

input {
  beats {
    port                      => 5044
    host                      => "0.0.0.0"
    id                        => "exchange_router_input"
    client_inactivity_timeout => 3600
    include_codec_tag         => false
    ecs_compatibility         => "disabled"
    ssl_enabled               => false
  }
}

filter {
  # Filebeat 7/8: path `source`, Filebeat 8/9 filestream: [log][file][path]
  if ![log][file][path] {
    if [log][source] {
      mutate { copy => { "[log][source]" => "[log][file][path]" } }
    } else if [source] {
      mutate { copy => { "source" => "[log][file][path]" } }
    }
  }

  # Header / yorum satırlarını parse etmeden düşür
  if [message] =~ /^#/ {
    drop {}
  }

  # ---- Tag alias normalizasyonu --------------------------------
  if "ExchangeMsgTrack" in [tags] or "MsgTrack" in [tags] or "msgtrk" in [tags] {
    mutate { add_tag => ["MessageTracking"] }
  }

  # ---- Tag yoksa log_type veya dosya yolundan türet ------------
  # Ubuntu /data/exchange-logs kullanılmıyor; asıl kaynak Windows Filebeat.
  if "MessageTracking" not in [tags] and "ExchangeIIS" not in [tags] and "HttpProxy" not in [tags] and "MapiHttp" not in [tags] and "SmtpReceive" not in [tags] and "SmtpSend" not in [tags] {

    if [log_type] == "message-tracking" or [fields][log_type] == "message-tracking" or [log][file][path] =~ /(?i)(MessageTracking|MessageTrackingLogs|MSGTRK)/ {
      mutate { add_tag => ["MessageTracking"] }
    }
    else if [log_type] == "iis" or [fields][log_type] == "iis" or [log][file][path] =~ /(?i)(inetpub|[\\/]iis[\\/]|W3SVC)/ {
      mutate { add_tag => ["ExchangeIIS"] }
    }
    else if [log_type] == "httpproxy" or [fields][log_type] == "httpproxy" or [log][file][path] =~ /(?i)(HttpProxy)/ {
      mutate { add_tag => ["HttpProxy"] }
    }
    else if [log_type] == "mapihttp" or [fields][log_type] == "mapihttp" or [log][file][path] =~ /(?i)(MapiHttp)/ {
      mutate { add_tag => ["MapiHttp"] }
    }
    else if [log_type] == "smtp-receive" or [fields][log_type] == "smtp-receive" or [log][file][path] =~ /(?i)(SmtpReceive)/ {
      mutate { add_tag => ["SmtpReceive"] }
    }
    else if [log_type] == "smtp-send" or [fields][log_type] == "smtp-send" or [log][file][path] =~ /(?i)(SmtpSend)/ {
      mutate { add_tag => ["SmtpSend"] }
    }
  }
}

output {
  if "MessageTracking" in [tags] {
    pipeline {
      send_to         => "exchange-message-tracking"
      ensure_delivery => true
    }
  }
  else if "ExchangeIIS" in [tags] {
    pipeline {
      send_to         => "exchange-iis"
      ensure_delivery => true
    }
  }
  else if "HttpProxy" in [tags] or "MapiHttp" in [tags] {
    pipeline {
      send_to         => "exchange-http-protocol"
      ensure_delivery => true
    }
  }
  else if "SmtpReceive" in [tags] or "SmtpSend" in [tags] {
    pipeline {
      send_to         => "exchange-smtp"
      ensure_delivery => true
    }
  }
  else {
    # Tanınmayan event'i silme — teşhis için ayrı index'e yaz
    pipeline {
      send_to         => "exchange-unmatched"
      ensure_delivery => true
    }
  }
}
