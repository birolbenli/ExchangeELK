# ================================================================
# ARŞIV - Bu dosya artık kullanılmamaktadır.
#
# Yerini alan dosyalar (pipeline-to-pipeline mimari):
#   pipeline-router.conf             ← Giriş noktası (port 5044)
#   pipeline-message-tracking.conf   ← MessageTracking tag
#   pipeline-iis.conf                ← ExchangeIIS tag
#   pipeline-http-protocol.conf      ← HttpProxy + MapiHttp tag
#   pipeline-smtp.conf               ← SmtpReceive + SmtpSend tag
#
# pipelines.yml'den bu dosyaya referans KALDIRILMIŞTIR.
# Logstash bu dosyayı yüklemez.
# ================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # Parse different Exchange log types
  if [log][file][path] =~ /MessageTracking/ {
    mutate {
      add_tag => ["exchange", "message-tracking"]
    }
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp},%{DATA:client-ip},%{DATA:client-hostname},%{DATA:server-ip},%{DATA:server-hostname},%{DATA:source-context},%{DATA:connector-id},%{DATA:source},%{DATA:event-id},%{DATA:internal-message-id},%{DATA:message-id},%{DATA:network-message-id},%{DATA:recipient-address},%{DATA:recipient-status},%{DATA:total-bytes},%{DATA:recipient-count},%{DATA:related-recipient-address},%{DATA:reference},%{DATA:message-subject},%{DATA:sender-address},%{DATA:return-path},%{DATA:message-info},%{DATA:directionality},%{DATA:tenant-id},%{DATA:original-client-ip},%{DATA:original-server-ip},%{DATA:custom-data},%{GREEDYDATA:remaining}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" ]
      target => "@timestamp"
    }
    mutate {
      remove_field => [ "message", "remaining" ]
    }
  }
  
  else if [log][file][path] =~ /IIS/ or [log][file][path] =~ /W3SVC/ {
    mutate {
      add_tag => ["exchange", "iis"]
    }
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{IPORHOST:server-ip} %{WORD:method} %{URIPATH:uri-stem} %{NOTSPACE:uri-query} %{NUMBER:port} %{NOTSPACE:username} %{IPORHOST:client-ip} %{NOTSPACE:user-agent} %{NOTSPACE:referer} %{NUMBER:status} %{NUMBER:substatus} %{NUMBER:win32-status} %{NUMBER:time-taken}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
    }
  }
  
  else if [log][file][path] =~ /SMTP/ {
    mutate {
      add_tag => ["exchange", "smtp"]
    }
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp},%{DATA:connector-id},%{DATA:session-id},%{NUMBER:sequence-number},%{DATA:local-endpoint},%{DATA:remote-endpoint},%{DATA:event},%{DATA:data},%{DATA:context}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" ]
      target => "@timestamp"
    }
  }
  
  else if [log][file][path] =~ /Transport/ {
    mutate {
      add_tag => ["exchange", "transport"]
    }
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp},%{DATA:message-id},%{DATA:client-ip},%{DATA:client-hostname},%{DATA:server-ip},%{DATA:server-hostname},%{DATA:source-context},%{DATA:connector-id},%{DATA:source},%{DATA:event-id},%{GREEDYDATA:event-data}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" ]
      target => "@timestamp"
    }
  }

  # Common processing for all Exchange logs
  if "exchange" in [tags] {
    # Add server information
    mutate {
      add_field => { "exchange_server" => "%{[host][name]}" }
      add_field => { "environment" => "production" }
      add_field => { "dag_member" => "true" }
    }
    
    # Anonymize sensitive data if needed
    if [sender-address] {
      mutate {
        add_field => { "sender_domain" => "" }
      }
      ruby {
        code => "
          if event.get('sender-address') && event.get('sender-address').include?('@')
            event.set('sender_domain', event.get('sender-address').split('@')[1])
          end
        "
      }
    }
    
    if [recipient-address] {
      mutate {
        add_field => { "recipient_domain" => "" }
      }
      ruby {
        code => "
          if event.get('recipient-address') && event.get('recipient-address').include?('@')
            event.set('recipient_domain', event.get('recipient-address').split('@')[1])
          end
        "
      }
    }
    
    # Convert numeric fields
    if [total-bytes] {
      mutate {
        convert => { "total-bytes" => "integer" }
      }
    }
    
    if [recipient-count] {
      mutate {
        convert => { "recipient-count" => "integer" }
      }
    }
    
    if [status] {
      mutate {
        convert => { "status" => "integer" }
      }
    }
    
    if [time-taken] {
      mutate {
        convert => { "time-taken" => "integer" }
      }
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "[agent][version]", "[input][type]", "[ecs]" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    # Data stream: ILM + hot/warm/cold otomatik yönetilir
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "exchange"
    data_stream_namespace => "production"
    # Fallback: data stream desteklenmezse tarih bazlı index
    # index => "exchange-logs-%{+YYYY.MM.dd}"
    action => "create"
  }

  # Debug çıktısı - production'da bu bloğu kapatın
  # stdout {
  #   codec => rubydebug { metadata => false }
  # }
}