# ================================================================
# Pipeline: Router'da tag/path eşleşmeyen Filebeat event'leri
# Sessiz drop yerine exchange-unmatched-* index'ine yazılır.
# Teşhis: tags, log.file.path, message prefix.
# ================================================================

input {
  pipeline { address => "exchange-unmatched" }
}

filter {
  mutate {
    add_field => { "log_type" => "unmatched" }
    add_tag   => ["_unmatched_route"]
  }
}

output {
  elasticsearch {
    hosts              => ["http://elasticsearch:9200"]
    user               => "elastic"
    password           => "${ELASTIC_PASSWORD}"
    index              => "exchange-unmatched-%{+YYYY.MM.dd}"
    action             => "index"
    data_stream        => false
    ilm_enabled        => false
    manage_template    => false
    ecs_compatibility  => "disabled"
    ssl_enabled        => false
  }
}
