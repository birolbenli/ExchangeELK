# ================================================================
# Pipeline: FortiMail Syslog Logs
#
# Giriş   : UDP/TCP syslog port 5514 (doğrudan FortiMail'den)
# İndex   : fortimail-history-YYYY.MM.dd
#           fortimail-event-YYYY.MM.dd
#           fortimail-spam-YYYY.MM.dd
#           fortimail-virus-YYYY.MM.dd
#           fortimail-other-YYYY.MM.dd
#
# FortiMail Syslog Format (KV):
#   date=2024-01-15 time=10:23:45 device_id=FExxxxxx
#   log_id=xxxxxxxx type=history pri=information
#   session_id="abc" client_name="host" client_ip=1.2.3.4
#   dst_ip=5.6.7.8 direction=Incoming from="a@b.com"
#   to="c@d.com" subject="text" action=Relay status=Send
#   classifier=Normal mailer=Exchange ...
#
# FortiMail → ELK Sunucusu (UDP 5514 veya TCP 5514)
# ================================================================

input {
  # UDP syslog (varsayılan FortiMail gönderim şekli)
  udp {
    host  => "0.0.0.0"
    port  => 5514
    codec => plain { charset => "UTF-8" }
    id    => "fortimail_udp_5514"
    add_field => { "[@metadata][input_proto]" => "udp" }
  }

  # TCP syslog (FortiMail güvenilir iletim için)
  tcp {
    host  => "0.0.0.0"
    port  => 5514
    codec => line { charset => "UTF-8" }
    id    => "fortimail_tcp_5514"
    add_field => { "[@metadata][input_proto]" => "tcp" }
  }
}

filter {
  # ----------------------------------------------------------------
  # 1. Syslog başlığını temizle (RFC3164: <priority>Mmm dd hh:mm:ss host ...)
  # ----------------------------------------------------------------
  grok {
    match => {
      "message" => [
        # RFC 3164 başlığı varsa
        "<%{NONNEGINT:syslog_priority}>%{SYSLOGTIMESTAMP:syslog_ts} %{HOSTNAME:syslog_host} %{GREEDYDATA:fm_raw}",
        # RFC 5424 başlığı varsa
        "<%{NONNEGINT:syslog_priority}>%{NONNEGINT} %{TIMESTAMP_ISO8601:syslog_ts} %{HOSTNAME:syslog_host} %{NOTSPACE} %{NOTSPACE} %{NOTSPACE} %{NOTSPACE} %{GREEDYDATA:fm_raw}",
        # Başlıksız düz KV satırı
        "%{GREEDYDATA:fm_raw}"
      ]
    }
    tag_on_failure => ["_fm_syslog_header_fail"]
  }

  # Syslog başlığı alanlarını temizle
  mutate {
    remove_field => ["syslog_priority", "syslog_ts", "syslog_host"]
  }

  # fm_raw yoksa message'i kullan
  if ![fm_raw] or [fm_raw] == "" {
    mutate { add_field => { "fm_raw" => "%{message}" } }
  }

  # ----------------------------------------------------------------
  # 2. FortiMail KV ayrıştırma → tüm alanlar fm.* altına
  # ----------------------------------------------------------------
  kv {
    source              => "fm_raw"
    field_split         => " "
    value_split         => "="
    target              => "fm"
    remove_char_value   => "\""
    trim_key            => " \t"
    trim_value          => " \t"
    allow_duplicate_values => false
  }

  # ----------------------------------------------------------------
  # 3. Zorunlu alan kontrolü (FortiMail logu değilse bırak)
  # ----------------------------------------------------------------
  if ![fm][type] and ![fm][log_id] {
    mutate { add_tag => ["_fm_not_fortimail"] }
    drop {}
  }

  # ----------------------------------------------------------------
  # 4. Timestamp → @timestamp
  # ----------------------------------------------------------------
  if [fm][date] and [fm][time] {
    mutate { add_field => { "[@metadata][fm_datetime]" => "%{[fm][date]} %{[fm][time]}" } }
    date {
      match    => ["[@metadata][fm_datetime]", "yyyy-MM-dd HH:mm:ss"]
      timezone => "Europe/Istanbul"
    }
  }

  # ----------------------------------------------------------------
  # 5. Üst seviye alan kopyalama (arama kolaylığı için)
  # ----------------------------------------------------------------
  mutate {
    rename => {
      "[fm][type]"        => "log_type"
      "[fm][pri]"         => "severity"
      "[fm][device_id]"   => "device_id"
      "[fm][direction]"   => "direction"
      "[fm][action]"      => "action"
      "[fm][status]"      => "status"
      "[fm][from]"        => "from_addr"
      "[fm][to]"          => "to_addr"
      "[fm][subject]"     => "subject"
      "[fm][client_ip]"   => "client_ip"
      "[fm][dst_ip]"      => "dst_ip"
      "[fm][client_name]" => "client_name"
      "[fm][classifier]"  => "classifier"
      "[fm][domain]"      => "domain"
      "[fm][polid]"       => "policy_id"
      "[fm][mailer]"      => "mailer"
      "[fm][msg_id]"      => "msg_id"
      "[fm][sess_duration]" => "sess_duration"
      "[fm][bandwidth]"   => "bandwidth"
      "[fm][virus]"       => "virus_name"
      "[fm][msg]"         => "event_msg"
      "[fm][user]"        => "fm_user"
      "[fm][ui]"          => "admin_ui"
      "[fm][session_id]"  => "session_id"
      "[fm][resolved]"    => "resolved"
      "[fm][endpoint]"    => "endpoint"
      "[fm][fqdn]"        => "fortimail_fqdn"
    }
    remove_field => ["fm_raw", "fm", "message", "host"]
  }

  # ----------------------------------------------------------------
  # 6. Sayısal dönüşümler
  # ----------------------------------------------------------------
  mutate {
    convert => {
      "policy_id"    => "integer"
      "bandwidth"    => "integer"
      "sess_duration" => "integer"
    }
  }

  # ----------------------------------------------------------------
  # 7. Gönderici / alıcı domain çıkar
  # ----------------------------------------------------------------
  if [from_addr] and [from_addr] =~ /@/ {
    mutate { add_field => { "from_domain" => "%{from_addr}" } }
    mutate { gsub => ["from_domain", "^.*@", ""] }
  }

  if [to_addr] and [to_addr] =~ /@/ {
    mutate { add_field => { "to_domain" => "%{to_addr}" } }
    mutate { gsub => ["to_domain", "^.*@", ""] }
  }

  # ----------------------------------------------------------------
  # 8. GeoIP – client_ip (harici IP ise)
  # ----------------------------------------------------------------
  if [client_ip] and
     [client_ip] !~ "(^127\.)|(^10\.)|(^172\.1[6-9]\.)|(^172\.2[0-9]\.)|(^172\.3[0-1]\.)|(^192\.168\.)|(^169\.254\.)|(\:\:1)|(^-$)|(^$)" {
    geoip {
      source            => "client_ip"
      target            => "geoip"
      ecs_compatibility => "disabled"
      add_tag => ["geoip"]
      add_field => { "[geoip][coordinates]" => "%{[geoip][longitude]}" }
      add_field => { "[geoip][coordinates]" => "%{[geoip][latitude]}" }
    }
    mutate { convert => { "[geoip][coordinates]" => "float" } }
  }

  # ----------------------------------------------------------------
  # 9. Etiket zenginleştirme
  # ----------------------------------------------------------------
  mutate {
    add_field => { "log_source" => "fortimail" }
  }

  # Yön etiketleri
  if [direction] == "Incoming" or [direction] == "incoming" {
    mutate { add_tag => ["inbound"] }
  } else if [direction] == "Outgoing" or [direction] == "outgoing" {
    mutate { add_tag => ["outbound"] }
  }

  # Engelli/spam etiketleri
  if [action] in ["Reject", "Discard", "Block"] or
     [status] in ["Reject", "Discard", "Block"] {
    mutate { add_tag => ["blocked"] }
  }

  if [classifier] in ["Spam", "Bulk"] {
    mutate { add_tag => ["spam"] }
  }

  if [virus_name] and [virus_name] != "" and [virus_name] != "N/A" {
    mutate { add_tag => ["virus"] }
  }

  # ----------------------------------------------------------------
  # 10. log_type normalize et (varsayılan: other)
  # ----------------------------------------------------------------
  if ![log_type] {
    mutate { add_field => { "log_type" => "other" } }
  }
  mutate { lowercase => ["log_type"] }
}

output {
  # İndex: fortimail-{type}-YYYY.MM.dd
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "fortimail-%{log_type}-%{+YYYY.MM.dd}"
    manage_template    => false
    ecs_compatibility  => "disabled"
    action   => "index"
  }
}
