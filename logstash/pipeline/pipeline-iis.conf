# ================================================================
# Pipeline 2: Exchange IIS W3C Logs
# Port   : 5046
# Filebeat tag: ExchangeIIS
# Index  : exchange-iis-YYYY.MM.dd
#
# Exchange IIS log formatı (#Fields satırı örnek):
#  date time s-ip cs-method cs-uri-stem cs-uri-query s-port
#  cs-username c-ip cs(User-Agent) cs(Referer) sc-status
#  sc-substatus sc-win32-status time-taken x-forwarded-for
#
# NOT: IIS'de X-Forwarded-For aktif edilmiştir (son alan: OrgclientIP)
#      Aktif edilmemişse ikinci grok pattern uygulanır.
# ================================================================

input {
  # Router pipeline'dan alınan olaylar
  pipeline { address => "exchange-iis" }
}

filter {
  if "ExchangeIIS" in [tags] {

    # ---- Header satırlarını atla (# ile başlayanlar) -------------
    if [message] =~ /^#/ {
      drop {}
    }

    # ---- Grok: X-Forwarded-For AKTİF (OrgclientIP son sütun) ----
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{IPORHOST:serverIP} %{WORD:method} %{URIPATH:uriStem} %{NOTSPACE:uriQuery} %{NUMBER:port} %{NOTSPACE:username} %{IPORHOST:clientIP} %{NOTSPACE:userAgent} %{NOTSPACE:referer} %{NUMBER:response} %{NUMBER:subresponse} %{NUMBER:win32response} %{NUMBER:timetaken} %{IPORHOST:OrgclientIP}"
      }
      tag_on_failure => ["_iis_grok_xfwd_failure"]
    }

    # ---- Grok fallback: X-Forwarded-For YOK ----------------------
    if "_iis_grok_xfwd_failure" in [tags] {
      grok {
        match => {
          "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{IPORHOST:serverIP} %{WORD:method} %{URIPATH:uriStem} %{NOTSPACE:uriQuery} %{NUMBER:port} %{NOTSPACE:username} %{IPORHOST:clientIP} %{NOTSPACE:userAgent} %{NOTSPACE:referer} %{NUMBER:response} %{NUMBER:subresponse} %{NUMBER:win32response} %{NUMBER:timetaken}"
        }
        tag_on_failure => ["_iis_grok_failure"]
      }
    }

    if "_iis_grok_failure" in [tags] {
      drop {}
    }

    # ---- Timestamp -----------------------------------------------
    date {
      match    => ["log_timestamp", "YYYY-MM-dd HH:mm:ss"]
      timezone => "Europe/Istanbul"
      remove_field => ["log_timestamp"]
    }

    # ---- Tür dönüştürmeler + temizlik ---------------------------
    mutate {
      convert => ["timetaken",  "integer"]
      convert => ["port",       "integer"]
      convert => ["response",   "integer"]
      convert => ["subresponse","integer"]
      convert => ["win32response","integer"]
    }

    # ---- User-Agent ayrıştır ------------------------------------
    if [userAgent] and [userAgent] != "-" {
      useragent {
        source => "userAgent"
        target => "ua"
      }
    }

    # ---- GeoIP: OrgclientIP (X-Forwarded-For) tercihli ----------
    # Önce OrgclientIP dene (X-Forwarded-For aktifse)
    if [OrgclientIP] and
       [OrgclientIP] !~ "(^127\.)|(^10\.)|(^172\.1[6-9]\.)|(^172\.2[0-9]\.)|(^172\.3[0-1]\.)|(^192\.168\.)|(^169\.254\.)|(\:\:1)|(^-$)|(^$)" {
      geoip {
        source             => "OrgclientIP"
        target             => "geoip"
        database           => "/usr/share/logstash/geoip/GeoLite2-City.mmdb"
        ecs_compatibility  => "disabled"
        add_tag => ["geoip", "traffic-wan"]
        add_field => {
          "[geoip][coordinates]" => "%{[geoip][longitude]}"
        }
        add_field => {
          "[geoip][coordinates]" => "%{[geoip][latitude]}"
        }
      }
      mutate {
        convert => {"[geoip][coordinates]" => "float"}
      }
    }
    # OrgclientIP yoksa clientIP üzerinden dene
    else if [clientIP] and
            [clientIP] !~ "(^127\.)|(^10\.)|(^172\.1[6-9]\.)|(^172\.2[0-9]\.)|(^172\.3[0-1]\.)|(^192\.168\.)|(^169\.254\.)|(\:\:1)|(^-$)|(^$)" {
      geoip {
        source             => "clientIP"
        target             => "geoip"
        database           => "/usr/share/logstash/geoip/GeoLite2-City.mmdb"
        ecs_compatibility  => "disabled"
        add_tag => ["geoip", "traffic-wan"]
        add_field => {
          "[geoip][coordinates]" => "%{[geoip][longitude]}"
        }
        add_field => {
          "[geoip][coordinates]" => "%{[geoip][latitude]}"
        }
      }
      mutate {
        convert => {"[geoip][coordinates]" => "float"}
      }
    }

    # ---- Meta etiketleri ----------------------------------------
    mutate {
      add_field => {
        "log_type"        => "iis"
        "exchange_server" => "%{[host][name]}"
      }
    }
  }
}

output {
  if "ExchangeIIS" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index => "exchange-iis-%{+YYYY.MM.dd}"
    }
  }
}