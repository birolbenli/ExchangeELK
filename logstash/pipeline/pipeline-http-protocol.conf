# ================================================================
# Pipeline 3: Exchange HTTP Protocol Logs (HttpProxy + MAPI HTTP)
# Port   : 5045
# Filebeat tags: HttpProxy | MapiHttp
# Indices: exchange-httpproxy-YYYY.MM.dd
#          exchange-mapihttp-YYYY.MM.dd
#
# HttpProxy : C:\Program Files\Microsoft\Exchange Server\V15\Logging\HttpProxy\
# MapiHttp  : C:\Program Files\Microsoft\Exchange Server\V15\Logging\MapiHttp\Emsmdb\
# ================================================================

input {
  # Router pipeline'dan alınan olaylar
  pipeline { address => "exchange-http-protocol" }
}

filter {

  # ---- Header satırlarını atla ---------------------------------
  if [message] =~ /^#/ {
    drop {}
  }

  # ==============================================================
  # HttpProxy Logs
  # ==============================================================
  if "HttpProxy" in [tags] {
    csv {
      columns => [
        "DateTime","RequestId","MajorVersion","MinorVersion","BuildVersion",
        "RevisionVersion","ClientRequestId","Protocol","UrlHost","UrlStem",
        "ProtocolAction","AuthenticationType","IsAuthenticated","AuthenticatedUser",
        "Organization","AnchorMailbox","UserAgent","ClientIpAddress",
        "ServerHostName","HttpStatus","BackEndStatus","ErrorCode","Method",
        "ProxyAction","TargetServer","TargetServerVersion","RoutingType",
        "RoutingHint","BackEndCookie","ServerLocatorHost","ServerLocatorLatency",
        "RequestBytes","ResponseBytes","TargetOutstandingRequests",
        "AuthModulePerfContext","HttpPipelineLatency","CalculateTargetBackEndLatency",
        "GlsLatencyBreakup","TotalGlsLatency","AccountForestLatencyBreakup",
        "TotalAccountForestLatency","ResourceForestLatencyBreakup",
        "TotalResourceForestLatency","ADLatency","SharedCacheLatencyBreakup",
        "TotalSharedCacheLatency","ActivityContextLifeTime",
        "ModuleToHandlerSwitchingLatency","ClientReqStreamLatency",
        "BackendReqInitLatency","BackendReqStreamLatency",
        "BackendProcessingLatency","BackendRespInitLatency",
        "BackendRespStreamLatency","ClientRespStreamLatency",
        "KerberosAuthHeaderLatency","HandlerCompletionLatency",
        "RequestHandlerLatency","HandlerToModuleSwitchingLatency",
        "ProxyTime","CoreLatency","RoutingLatency","HttpProxyOverhead",
        "TotalRequestTime","RouteRefresherLatency","UrlQuery",
        "BackEndGenericInfo","GenericInfo","GenericErrors","EdgeTraceId",
        "DatabaseGuid","UserADObjectGuid","PartitionEndpointLookupLatency",
        "RoutingStatus"
      ]
      remove_field => ["DateTime"]
      skip_empty_rows => true
    }

    grok {
      match => ["message", "%{TIMESTAMP_ISO8601:timestamp}"]
      tag_on_failure => ["_httpproxy_grok_failure"]
    }

    if "_httpproxy_grok_failure" in [tags] { drop {} }

    date {
      match    => ["timestamp", "ISO8601"]
      timezone => "Europe/Istanbul"
      remove_field => ["timestamp"]
    }

    mutate {
      convert => ["RequestBytes",  "integer"]
      convert => ["ResponseBytes", "integer"]
      convert => ["HttpStatus",    "integer"]
      convert => ["BackEndStatus", "integer"]
      convert => ["TotalRequestTime", "integer"]
      convert => ["BackendProcessingLatency", "integer"]
      split   => ["GenericInfo",   ";"]
      split   => ["GenericErrors", ";"]
      add_field => {
        "log_type"        => "httpproxy"
        "exchange_server" => "%{[host][name]}"
      }
    }

    # GeoIP: External client IP
    if [ClientIpAddress] and
       [ClientIpAddress] !~ "(^127\.)|(^10\.)|(^172\.1[6-9]\.)|(^172\.2[0-9]\.)|(^172\.3[0-1]\.)|(^192\.168\.)|(^169\.254\.)|(\:\:1)|(^-$)|(^$)" {
      geoip {
        source            => "ClientIpAddress"
        target            => "geoip"
        ecs_compatibility => "disabled"
        add_tag => ["geoip"]
      }
    }
  }

  # ==============================================================
  # MAPI HTTP Logs
  # ==============================================================
  else if "MapiHttp" in [tags] {
    csv {
      columns => [
        "DateTime","RequestId","MapiRequestId","ClientRequestId","RequestType",
        "HttpStatusCode","ResponseCode","StatusCode","ReturnCode",
        "TotalRequestLatency","DeploymentRing","MajorVersion","MinorVersion",
        "BuildVersion","RevisionVersion","AuthenticatedUserEmail","UPN","Puid",
        "TenantGuid","MailboxId","MDBGuid","ActAsUserEmail","ClientIP",
        "SourceCafeServer","EdgeInfo","NetworkDeviceInfo","SessionCookie",
        "SequenceCookie","MapiClientInfo","ClientSoftware","ClientSoftwareVersion",
        "ClientMode","AuthenticationType","AuthModuleLatency","LiveIdBasicLog",
        "LiveIdBasicError","LiveIdNegotiateError","OAuthLatency","OAuthError",
        "OAuthErrorCategory","OAuthExtraInfo","AuthenticatedUser","RopIds",
        "OperationSpecific","GenericInfo","GenericErrors"
      ]
      remove_field => [
        "DateTime","EdgeInfo","SessionCookie","SequenceCookie",
        "MapiClientInfo","NetworkDeviceInfo","UPN","TenantGuid","Puid",
        "DeploymentRing","AuthModuleLatency","LiveIdBasicLog","LiveIdBasicError",
        "LiveIdNegotiateError","OAuthLatency","OAuthError","OAuthErrorCategory",
        "OAuthExtraInfo","RopIds","GenericInfo"
      ]
      skip_empty_rows => true
    }

    grok {
      match => ["message", "%{TIMESTAMP_ISO8601:timestamp}"]
      tag_on_failure => ["_mapihttp_grok_failure"]
    }

    if "_mapihttp_grok_failure" in [tags] { drop {} }

    date {
      match    => ["timestamp", "ISO8601"]
      timezone => "Europe/Istanbul"
      remove_field => ["timestamp"]
    }

    mutate {
      convert => ["HttpStatusCode",      "integer"]
      convert => ["TotalRequestLatency", "integer"]
      add_field => {
        "log_type"        => "mapihttp"
        "exchange_server" => "%{[host][name]}"
      }
    }

    # GeoIP: External client IP
    if [ClientIP] and
       [ClientIP] !~ "(^127\.)|(^10\.)|(^172\.1[6-9]\.)|(^172\.2[0-9]\.)|(^172\.3[0-1]\.)|(^192\.168\.)|(^169\.254\.)|(\:\:1)|(^-$)|(^$)" {
      geoip {
        source            => "ClientIP"
        target            => "geoip"
        ecs_compatibility => "disabled"
        add_tag => ["geoip"]
      }
    }
  }
}

output {
  if "HttpProxy" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "exchange-httpproxy-%{+YYYY.MM.dd}"
    }
  }
  else if "MapiHttp" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "exchange-mapihttp-%{+YYYY.MM.dd}"
    }
  }
}