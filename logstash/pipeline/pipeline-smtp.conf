# ================================================================
# Pipeline 4: Exchange SMTP Protocol Logs
# Port   : 5047
# Filebeat tags: SmtpReceive | SmtpSend
# Indices: exchange-smtp-receive-YYYY.MM.dd
#          exchange-smtp-send-YYYY.MM.dd
#
# Log dosyaları:
#  Receive: C:\...\Exchange Server\V15\Logging\ProtocolLog\SmtpReceive\*.log
#  Send   : C:\...\Exchange Server\V15\Logging\ProtocolLog\SmtpSend\*.log
#
# Exchange SMTP log CSV formatı:
#  date-time,connector-id,session-id,sequence-number,local-endpoint,
#  remote-endpoint,event,data,context
# ================================================================

input {
  # Router pipeline'dan alınan olaylar
  pipeline { address => "exchange-smtp" }
}

filter {
  if "SmtpReceive" in [tags] or "SmtpSend" in [tags] {

    # ---- Header / boş satırları atla ----------------------------
    if [message] =~ /^#/ {
      drop {}
    }

    # ---- CSV Ayrıştırma -----------------------------------------
    csv {
      columns => [
        "date-time","connector-id","session-id","sequence-number",
        "local-endpoint","remote-endpoint","event","data","context"
      ]
      remove_field => ["date-time"]
      skip_empty_rows => true
    }

    # ---- Timestamp ----------------------------------------------
    grok {
      match => ["message", "%{TIMESTAMP_ISO8601:timestamp}"]
      tag_on_failure => ["_smtp_grok_failure"]
    }

    if "_smtp_grok_failure" in [tags] { drop {} }

    date {
      match    => ["timestamp", "ISO8601"]
      timezone => "Europe/Istanbul"
      remove_field => ["timestamp"]
    }

    # ---- Remote endpoint'ten IP ve Port çıkar -------------------
    # remote-endpoint formatı: "1.2.3.4:25"
    if [remote-endpoint] and [remote-endpoint] =~ /:/ {
      grok {
        match => {
          "remote-endpoint" => "%{IPORHOST:remote-ip}:%{NUMBER:remote-port}"
        }
        tag_on_failure => []
      }
      mutate {
        convert => ["remote-port", "integer"]
      }
    }

    # ---- GeoIP: Dış remote IP -----------------------------------
    if [remote-ip] and
       [remote-ip] !~ "(^127\.)|(^10\.)|(^172\.1[6-9]\.)|(^172\.2[0-9]\.)|(^172\.3[0-1]\.)|(^192\.168\.)|(^169\.254\.)|(\:\:1)|(^-$)|(^$)" {
      geoip {
        source            => "remote-ip"
        target            => "geoip"
        ecs_compatibility => "disabled"
        add_tag => ["geoip", "traffic-wan"]
        add_field => {
          "[geoip][coordinates]" => "%{[geoip][longitude]}"
        }
        add_field => {
          "[geoip][coordinates]" => "%{[geoip][latitude]}"
        }
      }
      mutate {
        convert => {"[geoip][coordinates]" => "float"}
      }
    }

    mutate {
      convert => ["sequence-number", "integer"]
      add_field => {
        "log_type"        => "smtp"
        "exchange_server" => "%{[host][name]}"
      }
    }
  }
}

output {
  if "SmtpReceive" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index => "exchange-smtp-receive-%{+YYYY.MM.dd}"
    }
  }
  else if "SmtpSend" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index => "exchange-smtp-send-%{+YYYY.MM.dd}"
    }
  }
}