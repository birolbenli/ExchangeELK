# ================================================================
# Pipeline 1: Exchange Message Tracking Logs
# Kaynak : router → address "exchange-message-tracking"
# Filebeat tag: MessageTracking | ExchangeMsgTrack
# Index  : exchange-msgtrk-YYYY.MM.dd
#
# Parse notları:
#  - Grok zorunlu değil; timestamp CSV'nin date-time kolonundan alınır
#  - _grokparsefailure ile drop YOK (sessiz veri kaybı olmasın)
#  - Tag tekrar şart değil (router zaten yönlendirdi)
# ================================================================

input {
  pipeline { address => "exchange-message-tracking" }
}

filter {
  # Header satırları router'da düşmüş olabilir; yine de koru
  if [message] =~ /^#/ {
    drop {}
  }

  # ECS / bazı Filebeat sürümlerinde satır [event][original] altında
  if ![message] and [event][original] {
    mutate { copy => { "[event][original]" => "message" } }
  }

  if [message] and [message] != "" {

    # ---- CSV Ayrıştırma ------------------------------------------
    csv {
      columns => [
        "date-time","client-ip","client-hostname","server-ip","server-hostname",
        "source-context","connector-id","source","event-id",
        "internal-message-id","message-id","network-message-id",
        "recipient-address","recipient-status","total-bytes","recipient-count",
        "related-recipient-address","reference","message-subject",
        "sender-address","return-path","message-info","directionality",
        "tenant-id","original-client-ip","original-server-ip","custom-data",
        "transport-traffic-type","log-id","schema-version"
      ]
      skip_empty_rows => true
    }

    # ---- Timestamp (CSV date-time; Exchange UTC / ISO8601) -------
    # timezone sadece zoneless değerler için kullanılır; 'Z' varsa UTC.
    date {
      match => [
        "date-time",
        "ISO8601",
        "YYYY-MM-dd'T'HH:mm:ss.SSSSSSSZ",
        "YYYY-MM-dd'T'HH:mm:ss.SSSZ",
        "YYYY-MM-dd'T'HH:mm:ssZ"
      ]
      timezone     => "UTC"
      target       => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
      remove_field => ["date-time"]
    }

    # gsub, mutate içinde split'ten ÖNCE çalışır (plugin sırası sabit)
    mutate {
      convert => ["total-bytes",     "integer"]
      convert => ["recipient-count", "integer"]
      gsub    => ["source-context", "[,/]", "_"]
    }

    mutate {
      split => ["recipient-address", ";"]
      split => ["source-context",    ";"]
      split => ["custom-data",       ";"]
    }

    # ---- Gönderici ve alıcı domain -------------------------------
    if [sender-address] and [sender-address] =~ /@/ {
      mutate {
        add_field => { "sender-domain" => "%{sender-address}" }
      }
      mutate {
        gsub => ["sender-domain", "^.*@", ""]
      }
    }

    if [recipient-address] {
      mutate {
        add_field => { "recipient-domain" => "%{recipient-address}" }
      }
      mutate {
        gsub => ["recipient-domain", "^.*@", ""]
        gsub => ["recipient-domain", "[\\[\\]\"]", ""]
      }
    }

    # ---- Dış IP GeoIP (original-client-ip) -----------------------
    if [original-client-ip] and
       [original-client-ip] !~ "(^127\.)|(^10\.)|(^172\.1[6-9]\.)|(^172\.2[0-9]\.)|(^172\.3[0-1]\.)|(^192\.168\.)|(^169\.254\.)|(\:\:1)|(^$)|(^-$)" {
      geoip {
        source            => "original-client-ip"
        target            => "geoip"
        database          => "/usr/share/logstash/geoip/GeoLite2-City.mmdb"
        ecs_compatibility => "disabled"
        tag_on_failure    => ["_geoip_lookup_failure"]
        add_tag           => ["geoip"]
        add_field         => {
          "[geoip][coordinates]" => "%{[geoip][longitude]}"
        }
        add_field         => {
          "[geoip][coordinates]" => "%{[geoip][latitude]}"
        }
      }
      mutate {
        convert => { "[geoip][coordinates]" => "float" }
      }
    }

    # ---- Meta etiketleri ----------------------------------------
    mutate {
      add_field => {
        "log_type"        => "message-tracking"
        "exchange_server" => "%{[host][name]}"
      }
      add_tag => ["MessageTracking"]
    }
  }
}

output {
  elasticsearch {
    hosts              => ["http://elasticsearch:9200"]
    user               => "elastic"
    password           => "${ELASTIC_PASSWORD}"
    index              => "exchange-msgtrk-%{+YYYY.MM.dd}"
    action             => "index"
    data_stream        => false
    ilm_enabled        => false
    manage_template    => false
    ecs_compatibility  => "disabled"
    ssl_enabled        => false
  }
}
