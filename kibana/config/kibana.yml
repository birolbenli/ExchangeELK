server.name: "kibana"
server.host: "0.0.0.0"
server.port: 5601
server.maxPayload: 10485760

elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.password: "${ELASTICSEARCH_PASSWORD}"
elasticsearch.requestTimeout: 90000
elasticsearch.shardTimeout: 30000

# Monitoring
monitoring.ui.container.elasticsearch.enabled: true

# Logging
logging.appenders.file.type: file
logging.appenders.file.fileName: /var/log/kibana.log
logging.appenders.file.layout.type: json
logging.root.level: warn

# Security (Kibana 9'da xpack.security.enabled kaldirildi; ES security=false ise auth otomatik devre disi)
xpack.security.encryptionKey: "exchange_elk_security_key_32chars!"
xpack.reporting.encryptionKey: "exchange_elk_reporting_key_32char"
xpack.encryptedSavedObjects.encryptionKey: "exchange_elk_key_32_characters_long"

# ---- SAML / Entra ID SSO -----------------------------------
xpack.security.authc.providers:
  saml.saml1:
    order: 0
    realm: saml1
    description: "Microsoft Entra ID ile Giriş"
  basic.basic1:
    order: 1
    description: "Kibana hesabı ile giriş"

xpack.security.loginAssistanceMessage: "Entra ID (kurumsal) hesabınızla oturum açabilirsiniz."

# Fleet (Elastic Agent yonetimi) - security=false ortaminda popup cikar, kapat gec
# xpack.fleet.enabled: false

# Dark mode
uiSettings.overrides:
  theme:darkMode: true